description = "Scan the whole codebase for SDK imports and report coverage gaps vs the airblander watchlist"
prompt = """
Scan the current working directory for SDK imports and cross-reference with the airblander watchlist. One-shot report, change nothing.

Steps:
1. Read ${CLAUDE_PLUGIN_ROOT}/config/watchlist.json for watched SDKs and their import patterns.
2. Read ~/.claude/airblander-state.json (or $CLAUDE_CONFIG_DIR/airblander-state.json) for cleared state.
3. Run: grep -rE "^(import|from|require|use)" . --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --include="*.py" --include="*.mjs" --include="*.rs" -h 2>/dev/null | sort -u
4. Match each import line against watched SDK patterns.
5. Find gap SDKs: packages imported in code NOT in the watchlist.

Output format:
## Airblander Coverage Report

### Watched & detected in codebase
  ✓ <sdk> — cleared this session
  ⚠ <sdk> — not cleared (docs needed before writing)

### Watched but not found in codebase
  • <sdk>

### GAP: imported but not watched (add these)
  • <package> → /airblander-add <name> <docs-url>

net: N watched SDKs, N in use, N gaps to add

If all in-use SDKs are cleared and no gaps: "All SDK imports covered and cleared. Ship it."
"""
